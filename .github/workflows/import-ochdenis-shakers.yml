name: Import OchDenis shaker images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-ochdenis-shakers.yml"
      - ".github/scripts/import_ochdenis_shakers.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ochdenis-shaker-import
  cancel-in-progress: false

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Download and validate first images for selected categories
        run: python .github/scripts/import_ochdenis_shakers.py

      - name: Write summary
        if: always()
        run: |
          if [ -f /tmp/ochdenis-shaker-summary.md ]; then
            cat /tmp/ochdenis-shaker-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Import did not complete. See the log above; no bulk commit was made." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit all imported shaker images
        run: |
          if git diff --quiet -- shaker; then
            echo "No image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shaker
          git commit -m "Import OchDenis shaker images [skip shaker-import]"
          git push
