name: Import OchDenis Creator-DE shaker images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-ochdenis-creator-de.yml"
      - ".github/scripts/import_ochdenis_creator_de.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ochdenis-creator-de-import
  cancel-in-progress: false

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Download and validate all 75 Creator-DE images
        run: python .github/scripts/import_ochdenis_creator_de.py

      - name: Write summary
        if: always()
        run: |
          if [ -f /tmp/creator-de-shaker-summary.md ]; then
            cat /tmp/creator-de-shaker-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Creator-DE import incomplete; no success commit was made." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit original images, manifests and compact CDN aliases
        run: |
          if [ -z "$(git status --porcelain -- shaker/creator-de shaker/creator-de-xl shaker/creator-de-thermo s/cd* s/cx* s/ct*)" ]; then
            echo "No Creator-DE image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- shaker/creator-de shaker/creator-de-xl shaker/creator-de-thermo
          for file in s/cd* s/cx* s/ct*; do
            [ -f "$file" ] && git add -- "$file"
          done
          git commit -m "Import 75 OchDenis Creator-DE shaker images [skip image-import]"
          git push
