name: Import OchDenis Spezial shaker images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-ochdenis-special.yml"
      - ".github/scripts/import_ochdenis_special.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ochdenis-special-shaker-import
  cancel-in-progress: false

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Download and validate all 66 Spezial images
        run: python .github/scripts/import_ochdenis_special.py

      - name: Write summary
        if: always()
        run: |
          if [ -f /tmp/special-shaker-summary.md ]; then
            cat /tmp/special-shaker-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Import failed; no image batch was committed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit all Spezial images
        run: |
          if [ -z "$(git status --porcelain -- shaker/spezial)" ]; then
            echo "No Spezial image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shaker/spezial
          git commit -m "Import 66 OchDenis Spezial shaker images [skip special-import]"
          git push
