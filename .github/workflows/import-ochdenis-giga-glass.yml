name: Import OchDenis Giga Gallon and Glasflasche shaker images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-ochdenis-giga-glass.yml"
      - ".github/scripts/import_ochdenis_giga_glass.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ochdenis-giga-glass-shaker-import
  cancel-in-progress: false

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Download and validate all Giga Gallon and Glasflasche images
        run: python .github/scripts/import_ochdenis_giga_glass.py

      - name: Write summary
        if: always()
        run: |
          if [ -f /tmp/giga-glass-shaker-summary.md ]; then
            cat /tmp/giga-glass-shaker-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Import did not complete. See logs; no success commit was made." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit original images, manifests and CDN aliases
        run: |
          if [ -z "$(git status --porcelain -- shaker/giga-gallon shaker/glasflasche s/gg* s/gf*)" ]; then
            echo "No Giga Gallon or Glasflasche image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- shaker/giga-gallon shaker/glasflasche
          for file in s/gg* s/gf*; do
            [ -f "$file" ] && git add -- "$file"
          done
          git commit -m "Import OchDenis Giga Gallon and Glasflasche shaker images [skip image-import]"
          git push
