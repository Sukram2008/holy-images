name: Import OchDenis Thermo shaker images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-ochdenis-thermo.yml"
      - ".github/scripts/import_ochdenis_thermo_shakers.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ochdenis-thermo-shaker-import
  cancel-in-progress: false

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Download and validate all 95 Thermo images
        run: python .github/scripts/import_ochdenis_thermo_shakers.py

      - name: Write summary
        if: always()
        run: |
          if [ -f /tmp/thermo-shaker-summary.md ]; then
            cat /tmp/thermo-shaker-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Thermo import incomplete; no success commit was made." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit original images, manifest and compact CDN aliases
        run: |
          if [ -z "$(git status --porcelain -- shaker/thermo s/th*)" ]; then
            echo "No Thermo image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- shaker/thermo
          for file in s/th*; do
            [ -f "$file" ] && git add -- "$file"
          done
          git commit -m "Import 95 OchDenis Thermo shaker images [skip image-import]"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after refreshing main."
          done
          echo "Could not push Thermo import after 4 attempts."
          exit 1
