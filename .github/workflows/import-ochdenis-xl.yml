name: Import OchDenis XL shaker images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-ochdenis-xl.yml"
      - ".github/scripts/import_ochdenis_xl_shakers.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ochdenis-xl-shaker-import
  cancel-in-progress: false

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Download and validate all 11 XL images
        run: python .github/scripts/import_ochdenis_xl_shakers.py

      - name: Write summary
        if: always()
        run: |
          if [ -f /tmp/xl-shaker-summary.md ]; then
            cat /tmp/xl-shaker-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Import failed; no XL image batch was committed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit original images and compact CDN aliases
        run: |
          if [ -z "$(git status --porcelain -- shaker/xl s/x*.webp s/x*.png s/x*.jpg)" ]; then
            echo "No XL image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- shaker/xl s/x*
          git commit -m "Import 11 OchDenis XL shaker images [skip xl-import]"
          git push
