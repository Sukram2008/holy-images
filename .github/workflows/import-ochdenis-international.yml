name: Import OchDenis international shaker categories

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-ochdenis-international.yml"
      - ".github/scripts/import_ochdenis_international.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ochdenis-international-shaker-import
  cancel-in-progress: false

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Download and validate the five additional exact categories
        run: python .github/scripts/import_ochdenis_international.py

      - name: Write summary
        if: always()
        run: |
          if [ -f /tmp/international-shaker-summary.md ]; then
            cat /tmp/international-shaker-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Import incomplete; no batch commit was made." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit original images, manifests and compact CDN aliases
        run: |
          if [ -z "$(git status --porcelain -- shaker/creator-fr shaker/creator-fr-thermo shaker/creator-fr-glasflasche shaker/creator-uk shaker/sport-flasche s/cf* s/cft* s/cfg* s/uk* s/sf*)" ]; then
            echo "No new image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- shaker/creator-fr shaker/creator-fr-thermo shaker/creator-fr-glasflasche shaker/creator-uk shaker/sport-flasche
          for file in s/cf* s/cft* s/cfg* s/uk* s/sf*; do
            [ -f "$file" ] && git add -- "$file"
          done
          git commit -m "Import remaining OchDenis shaker category images [skip image-import]"
          git push
