name: Import OchDenis Tub images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-ochdenis-tubs.yml"
      - ".github/scripts/import_ochdenis_tubs.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ochdenis-tub-import
  cancel-in-progress: false

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow

      - name: Download and validate all OchDenis Tub images
        run: python .github/scripts/import_ochdenis_tubs.py

      - name: Commit all images
        run: |
          if git diff --quiet -- sorten; then
            echo "No image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sorten
          git commit -m "Import all OchDenis Tub images [skip image-import]"
          git push
